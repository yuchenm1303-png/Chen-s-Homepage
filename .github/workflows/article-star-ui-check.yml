name: Check article star UI handoff

on:
  push:
    branches: ["feat/article-star-ui-handoff"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Validate article star UI runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check galaxy-homepage-lab/homepage-article-star-ui.js
          test -s galaxy-homepage-lab/homepage-article-star-ui.css
          grep -q 'homepage-article-star-ui.css' galaxy-homepage-lab/index.html
          grep -q 'homepage-article-star-ui.js?build=638d8be0' galaxy-homepage-lab/index.html
          grep -q 'projectWorldStarRect' galaxy-homepage-lab/homepage-article-star-ui.js
          grep -q "state = 'extracting'" galaxy-homepage-lab/homepage-article-star-ui.js
          grep -q "state = 'rejoining'" galaxy-homepage-lab/homepage-article-star-ui.js
          grep -q 'sourceGroup.visible = false' galaxy-homepage-lab/homepage-article-star-ui.js
          grep -q 'sourceGroup.visible = true' galaxy-homepage-lab/homepage-article-star-ui.js
          if grep -q 'SelectiveBloomEffect' galaxy-homepage-lab/homepage-article-star-ui.js; then
            echo 'Article UI must not reintroduce depth-dependent SelectiveBloomEffect' >&2
            exit 1
          fi
