name: Deploy galaxy preview to smirel.com/galaxy

on:
  push:
    branches: ["feat/galaxy-homepage-redesign"]
    paths:
      - "galaxy-homepage-lab/**"
      - ".github/workflows/deploy-galaxy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: galaxy-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production homepage
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          persist-credentials: false

      - name: Checkout pinned production galaxy release
        uses: actions/checkout@v4
        with:
          ref: c5e5db7feebe008f76bdc84cf260cd3280b13fd3
          path: galaxy-release
          persist-credentials: false

      - name: Checkout galaxy development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: galaxy-source
          persist-credentials: false

      - name: Checkout pinned liquid glass shader source
        uses: actions/checkout@v4
        with:
          repository: yuchenm1303-png/yuchen1303.github.io
          ref: 48b489c08dd226444d8f40be97ea03eb1c7ac714
          path: glass-source
          persist-credentials: false

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          rsync -a --exclude='.git' production/ published/

          # Keep the production homepage directly at smirel.com/.
          rsync -a galaxy-release/galaxy-homepage-lab/ published/

          # Keep the moving development build isolated at smirel.com/galaxy/.
          rm -rf published/galaxy
          mkdir -p published/galaxy
          rsync -a --delete galaxy-source/galaxy-homepage-lab/ published/galaxy/

          test -s published/index.html
          test -s published/homepage-star-activity.js
          test -s published/galaxy/index.html
          if grep -q 'stellar-homepage' published/index.html; then
            echo 'Unexpected stellar-homepage path in production root index' >&2
            exit 1
          fi
          test "$(tr -d '\r\n' < published/CNAME)" = "smirel.com"

      - name: Localize blocking liquid glass shader
        shell: bash
        run: |
          set -euo pipefail
          GLASS_SOURCE="glass-source/ai-ledger-android/opengl-glass-edge-mini-v24-shader.js"
          GLASS_NAME="opengl-glass-edge-mini-v24-shader.js"
          GLASS_REMOTE="https://raw.githack.com/yuchenm1303-png/yuchen1303.github.io/48b489c08dd226444d8f40be97ea03eb1c7ac714/ai-ledger-android/opengl-glass-edge-mini-v24-shader.js"
          GLASS_LOCAL="./vendor/${GLASS_NAME}"

          test -s "$GLASS_SOURCE"
          mkdir -p published/vendor published/galaxy/vendor
          cp "$GLASS_SOURCE" "published/vendor/${GLASS_NAME}"
          cp "$GLASS_SOURCE" "published/galaxy/vendor/${GLASS_NAME}"
          cmp -s "$GLASS_SOURCE" "published/vendor/${GLASS_NAME}"
          cmp -s "$GLASS_SOURCE" "published/galaxy/vendor/${GLASS_NAME}"

          python - <<'PY'
          from pathlib import Path

          remote = "https://raw.githack.com/yuchenm1303-png/yuchen1303.github.io/48b489c08dd226444d8f40be97ea03eb1c7ac714/ai-ledger-android/opengl-glass-edge-mini-v24-shader.js"
          local = "./vendor/opengl-glass-edge-mini-v24-shader.js"
          for name in ("published/index.html", "published/galaxy/index.html"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if remote not in text:
                  raise SystemExit(f"Pinned liquid-glass source URL missing from {name}")
              path.write_text(text.replace(remote, local), encoding="utf-8")
          PY

          grep -Fq "$GLASS_LOCAL" published/index.html
          grep -Fq "$GLASS_LOCAL" published/galaxy/index.html
          if grep -Fq 'raw.githack.com' published/index.html published/galaxy/index.html; then
            echo 'A blocking raw.githack.com dependency remains in the published homepage' >&2
            exit 1
          fi

      - name: Build static galaxy runtime before deploy
        shell: bash
        run: |
          set -euo pipefail
          BUILDER="galaxy-source/galaxy-homepage-lab/tools/build-static-runtime.mjs"
          STARTUP_OPTIMIZER="galaxy-source/galaxy-homepage-lab/tools/parallelize-galaxy-startup.mjs"
          node --check "$BUILDER"
          node --check "$STARTUP_OPTIMIZER"

          # Execute the exact existing loader transformations during the build,
          # so mobile browsers receive the already-expanded renderer module.
          node "$BUILDER" published "${GITHUB_SHA}-production"
          node "$BUILDER" published/galaxy "${GITHUB_SHA}-preview"

          # The precomputed star cache and the expensive continuum shader used to
          # run serially. Start both as early as possible and join them only at
          # the point where real star buffers are bound, without changing pixels.
          node "$STARTUP_OPTIMIZER" published
          node "$STARTUP_OPTIMIZER" published/galaxy

          test -s published/astra-homepage-runtime.generated.js
          test -s published/galaxy/astra-homepage-runtime.generated.js
          grep -q '__SMIREL_STAR_FLIGHT_INSTALL__' published/astra-homepage-runtime.generated.js
          grep -q '__SMIREL_HOMEPAGE_GLASS_SYNC__' published/astra-homepage-runtime.generated.js
          grep -q '__SMIREL_STAR_FLIGHT_INSTALL__' published/galaxy/astra-homepage-runtime.generated.js
          grep -q '__SMIREL_HOMEPAGE_GLASS_SYNC__' published/galaxy/astra-homepage-runtime.generated.js
          grep -q 'renderer.compileAsync(continuumScene, continuumCamera)' published/astra-homepage-runtime.generated.js
          grep -q 'renderer.compileAsync(continuumScene, continuumCamera)' published/galaxy/astra-homepage-runtime.generated.js
          grep -q 'smirel-star-cache-bootstrap' published/index.html
          grep -q 'smirel-star-cache-bootstrap' published/galaxy/index.html

          if grep -q 'astra-homepage-glass-capture-loader.js' published/index.html; then
            echo 'Production root still references the runtime Blob loader' >&2
            exit 1
          fi
          if grep -q 'astra-homepage-glass-capture-loader.js' published/galaxy/index.html; then
            echo 'Galaxy preview still references the runtime Blob loader' >&2
            exit 1
          fi
          if grep -q 'homepage-galaxy-preload.js' published/index.html; then
            echo 'Production root still references the temporary preload shim' >&2
            exit 1
          fi
          if grep -q 'homepage-galaxy-preload.js' published/galaxy/index.html; then
            echo 'Galaxy preview still references the temporary preload shim' >&2
            exit 1
          fi
          if grep -q 'rel="preload" href="./astra-starfield-cache.bin' published/index.html published/galaxy/index.html; then
            echo 'Legacy star-cache preload hint remains beside the active early fetch' >&2
            exit 1
          fi

          cp published/astra-homepage-runtime.generated.js /tmp/astra-homepage-runtime-root.mjs
          cp published/galaxy/astra-homepage-runtime.generated.js /tmp/astra-homepage-runtime-preview.mjs
          node --check /tmp/astra-homepage-runtime-root.mjs
          node --check /tmp/astra-homepage-runtime-preview.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined homepage and galaxy preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
