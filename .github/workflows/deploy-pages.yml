name: Deploy homepage to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          persist-credentials: false

      - name: Checkout pinned galaxy homepage release
        uses: actions/checkout@v4
        with:
          ref: 507cd759ff39df5fe067135e10c1af7e106a818c
          path: galaxy-release
          persist-credentials: false

      - name: Verify committed Listing Studio icon
        shell: bash
        run: test -s production/download/listing-studio-product-icon.png

      - name: Assemble production homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          rsync -a --exclude='.git' production/ published/
          rsync -a galaxy-release/galaxy-homepage-lab/ published/
          test -s production/homepage-field-hud.css
          cp production/homepage-field-hud.css published/homepage-field-hud.css
          sed -i "/homepage-star-detail.css/a\\  <link rel=\"stylesheet\" href=\"./homepage-field-hud.css?build=${GITHUB_SHA::12}\" />" published/index.html
          test -s published/index.html
          test -s published/homepage-field-hud.css
          test -s published/homepage-star-activity.js
          test -s published/homepage-star-emission-boost.js
          test -s published/homepage-star-temporal-stability.js
          test -s published/homepage-star-picker-entry-v3.js
          test -s published/homepage-star-picker-v3.js
          test -s published/homepage-blog-constellation-layout.js
          test -s published/homepage-project-detail-content.js
          test -s published/homepage-project-detail.css
          test -s published/homepage-project-overview-scale-v3.css
          test -s published/homepage-detail-star-ui.js
          test -s published/homepage-detail-star-ui-viewport-fix.js
          test -s published/astra-homepage-glass-capture-loader.js
          test -s published/homepage-language.js
          test -s published/homepage-language.css
          test -s published/homepage-content-i18n.js
          test -s published/homepage-project-language-bridge.js
          test -s published/homepage-project-ui-polish-v4.css
          node --check published/homepage-detail-star-ui.js
          node --check published/homepage-detail-star-ui-viewport-fix.js
          node --check published/astra-homepage-glass-capture-loader.js
          node --check published/homepage-star-temporal-stability.js
          node --check published/homepage-language.js
          node --check published/homepage-content-i18n.js
          node --check published/homepage-project-language-bridge.js
          grep -Fq "homepage-field-hud.css?build=${GITHUB_SHA::12}" published/index.html
          grep -q 'compact atlas-style HUD' published/homepage-field-hud.css
          grep -q 'homepage-star-picker-entry-v3.js?build=93c984f4' published/index.html
          grep -q 'homepage-star-picker-v3.js?build=' published/index.html
          grep -q 'homepage-star-emission-boost.js?build=aaec8612' published/index.html
          grep -q 'homepage-star-temporal-stability.js?build=5acaac50' published/index.html
          grep -q 'homepage-detail-star-ui.js?build=v3-7ce523fc' published/index.html
          grep -q 'homepage-detail-star-ui-viewport-fix.js?build=41310ff6' published/index.html
          grep -q 'astra-homepage-glass-capture-loader.js?build=ui-v3-bb0e85de' published/index.html
          grep -q 'homepage-project-overview-scale-v3.css?build=e80a0bba' published/index.html
          grep -q 'homepage-project-ui-polish-v4.css?build=3598df03' published/index.html
          grep -q 'Versioned project UI polish' published/homepage-project-ui-polish-v4.css
          grep -q 'homepage-language.js?build=restore-20260907' published/index.html
          grep -q 'homepage-content-i18n.js?build=restore-20260907' published/index.html
          grep -q 'homepage-project-language-bridge.js?build=restore-20260907' published/index.html
          grep -q 'smirel-language-toggle' published/homepage-language.js
          grep -q 'CLOSE_APPROACH_START = 0.82' published/homepage-star-emission-boost.js
          grep -q 'CLOSE_APPROACH_FULL = 0.985' published/homepage-star-emission-boost.js
          grep -q 'CORE_MAX_BOOST = 1.85' published/homepage-star-emission-boost.js
          grep -q 'CHROMOSPHERE_MAX_BOOST = 1.45' published/homepage-star-emission-boost.js
          grep -q 'CORONA_MAX_BOOST = 1.25' published/homepage-star-emission-boost.js
          grep -q 'model.halo.material.opacity = 0' published/homepage-star-emission-boost.js
          grep -q 'uEmissionBoost' published/homepage-star-emission-boost.js
          grep -q 'STONE_B_STABLE' published/homepage-star-temporal-stability.js
          grep -q 'MICRO_A_STABLE' published/homepage-star-temporal-stability.js
          grep -q 'MICRO_B_STABLE' published/homepage-star-temporal-stability.js
          grep -q 'DETAIL_CORE_SPIN_RAD_S = 0.012' published/homepage-star-temporal-stability.js
          grep -q 'DETAIL_CORONA_SPIN_RAD_S = -0.006' published/homepage-star-temporal-stability.js
          grep -q 'bloom.intensity = CONFIG.bloomIntensity' published/astra-homepage-glass-capture-loader.js
          grep -q 'bloom.mipmapBlurPass.radius = CONFIG.bloomRadius' published/astra-homepage-glass-capture-loader.js
          grep -q 'starFlight?.renderDetailStarUi?.(renderer)' published/astra-homepage-glass-capture-loader.js
          grep -q '__smirelDetailStarUiV3' published/homepage-detail-star-ui.js
          grep -q '__smirelDetailStarUiViewportFix' published/homepage-detail-star-ui-viewport-fix.js
          grep -q 'renderer.getPixelRatio' published/homepage-detail-star-ui-viewport-fix.js
          grep -q 'args\[0\] / correction' published/homepage-detail-star-ui-viewport-fix.js
          grep -q 'function detailModeReady' published/homepage-detail-star-ui.js
          grep -q "controller.activeObject?.kind === 'project' ? 0.37 : 0.35" published/homepage-detail-star-ui.js
          grep -q 'const uiScene = new THREE.Scene()' published/homepage-detail-star-ui.js
          grep -q 'new THREE.PerspectiveCamera(UI_FOV, 1' published/homepage-detail-star-ui.js
          grep -q 'uiCamera.aspect = 1' published/homepage-detail-star-ui.js
          grep -q 'restoreArrivalCamera' published/homepage-detail-star-ui.js
          grep -q 'uiGroup = group.clone(true)' published/homepage-detail-star-ui.js
          grep -q 'uiScene.add(uiGroup)' published/homepage-detail-star-ui.js
          grep -q 'uiGroup.scale.setScalar' published/homepage-detail-star-ui.js
          grep -q 'renderer.setViewport(x, y, size, size)' published/homepage-detail-star-ui.js
          grep -q 'renderer.setScissor(x, y, size, size)' published/homepage-detail-star-ui.js
          grep -q 'renderer.render(uiScene, uiCamera)' published/homepage-detail-star-ui.js
          grep -q 'controller.renderDetailStarUi' published/homepage-detail-star-ui.js
          grep -q "state === 'extracting' || state === 'rejoining'" published/homepage-detail-star-ui.js
          grep -q 'function squareRect' published/homepage-detail-star-ui.js
          if grep -q 'new THREE.WebGLRenderer' published/homepage-detail-star-ui.js; then
            echo 'Detail UI must reuse the galaxy WebGLRenderer instead of creating a second WebGL context' >&2
            exit 1
          fi
          if grep -q 'cloneMaterial' published/homepage-detail-star-ui.js; then
            echo 'Detail UI must share stellar materials instead of cloning and resyncing them every frame' >&2
            exit 1
          fi
          if grep -q 'EffectComposer' published/homepage-detail-star-ui.js; then
            echo 'Detail UI must not create a second EffectComposer' >&2
            exit 1
          fi
          if grep -q 'CAMERA_RELEASE_MS' published/homepage-detail-star-ui.js; then
            echo 'Detail UI must not move the galaxy camera after handoff' >&2
            exit 1
          fi
          if grep -q 'UI_DEPTH' published/homepage-detail-star-ui.js; then
            echo 'Detail UI must not place the star off-axis in the galaxy camera' >&2
            exit 1
          fi
          if grep -q 'scene.add(uiGroup)' published/homepage-detail-star-ui.js; then
            echo 'Detail UI model must stay in its independent UI scene' >&2
            exit 1
          fi
          if grep -q 'homepage-article-star-ui.js' published/index.html; then
            echo 'Legacy note-only star UI runtime must not be loaded' >&2
            exit 1
          fi
          grep -q 'data-project-detail-open' published/homepage-project-detail-content.js
          grep -q 'data-project-detail-overlay' published/homepage-project-detail-content.js
          grep -q 'project-detail-expanded' published/homepage-project-detail-content.js
          grep -q '把供应商商品链接整理成可审核的 Makro 上架任务' published/homepage-project-detail-content.js
          grep -q 'height: 100dvh' published/homepage-project-detail.css
          grep -q 'grid-template-areas:' published/homepage-project-detail.css
          grep -q 'counter-reset: project-overview-point' published/homepage-project-detail.css
          grep -q 'width: 190px' published/homepage-project-detail.css
          grep -q 'width: min(680px, 43vw)' published/homepage-project-overview-scale-v3.css
          grep -q 'width: min(940px, 59vw)' published/homepage-project-overview-scale-v3.css
          grep -q 'grid-template-columns: repeat(4, minmax(0, 1fr))' published/homepage-project-overview-scale-v3.css
          grep -q 'font-size: clamp(56px, 4vw, 66px)' published/homepage-project-overview-scale-v3.css
          grep -q 'font-size: clamp(34px, 2.35vw, 40px)' published/homepage-project-overview-scale-v3.css
          grep -q 'font-size: clamp(13px, .84vw, 14px)' published/homepage-project-overview-scale-v3.css
          if grep -q 'stellarBloomActive ? 4.2' published/astra-homepage-glass-capture-loader.js; then
            echo 'Global flight bloom amplification must not return' >&2
            exit 1
          fi
          if grep -q 'starFlightActive ? 4.2' published/astra-homepage-glass-capture-loader.js; then
            echo 'Global flight bloom amplification must not return' >&2
            exit 1
          fi
          if grep -q 'SelectiveBloomEffect' published/astra-homepage-glass-capture-loader.js; then
            echo 'Depth-dependent SelectiveBloomEffect must not enter the depthless composer' >&2
            exit 1
          fi
          grep -q '__SMIREL_STAR_PICKER_BOOTSTRAP_V4__' published/homepage-star-picker-entry-v3.js
          grep -q 'about: 12089' published/homepage-blog-constellation-layout.js
          grep -q "'about-study': 1420" published/homepage-blog-constellation-layout.js
          grep -q 'projects: 12636' published/homepage-blog-constellation-layout.js
          grep -q "'computer-use': 9208" published/homepage-blog-constellation-layout.js
          grep -q 'blog: 1363' published/homepage-blog-constellation-layout.js
          grep -q 'contact: 3644' published/homepage-blog-constellation-layout.js
          if grep -q 'stellar-homepage' published/index.html; then
            echo 'Unexpected stellar-homepage path in production root index' >&2
            exit 1
          fi
          test "$(tr -d '\r\n' < published/CNAME)" = "smirel.com"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
