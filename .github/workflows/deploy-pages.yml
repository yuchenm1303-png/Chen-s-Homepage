# Deployment trigger refreshed by ChatGPT on 2026-08-27
name: Deploy homepage to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # listing-studio-product-icon.png is committed in this repository.
      # Keep Pages deployment self-contained instead of depending on anonymous
      # raw access to another repository, which can return 404 and block the
      # entire site from publishing.
      - name: Verify committed Listing Studio icon
        shell: bash
        run: test -s download/listing-studio-product-icon.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
