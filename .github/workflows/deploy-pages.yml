name: Deploy homepage to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          persist-credentials: false

      - name: Checkout pinned galaxy homepage release
        uses: actions/checkout@v4
        with:
          ref: c5e5db7feebe008f76bdc84cf260cd3280b13fd3
          path: galaxy-release
          persist-credentials: false

      - name: Verify committed Listing Studio icon
        shell: bash
        run: test -s production/download/listing-studio-product-icon.png

      - name: Assemble production homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          rsync -a --exclude='.git' production/ published/
          rm -rf published/stellar-homepage
          mkdir -p published/stellar-homepage
          rsync -a --delete galaxy-release/galaxy-homepage-lab/ published/stellar-homepage/
          test -s published/stellar-homepage/index.html
          test -s published/stellar-homepage/homepage-star-activity.js
          grep -q '<base href="/stellar-homepage/"' published/index.html
          test "$(tr -d '\r\n' < published/CNAME)" = "smirel.com"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
