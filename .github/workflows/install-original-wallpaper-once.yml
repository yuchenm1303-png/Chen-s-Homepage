name: Install original wallpaper once

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/install-original-wallpaper-once.yml"]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install original PNG
        env:
          ORIGINAL_URL: "https://at.adobe.com/5khrD7risjfDgDnt"
          ORIGINAL_SHA256: "e4b4b7746fc80be4e485359adc9df36e2645a597d71f0b460296f992cdb52e6e"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$ORIGINAL_URL" -o download/wallpaper-beach-blue-v1-original.png
          echo "$ORIGINAL_SHA256  download/wallpaper-beach-blue-v1-original.png" | sha256sum -c -
          sed -i -E 's#data-wallpaper-src="[^"]+"#data-wallpaper-src="./wallpaper-beach-blue-v1-original.png?v=20260828-1348-original-png"#' download/index.html

      - name: Commit wallpaper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/wallpaper-beach-blue-v1-original.png download/index.html
          git commit -m "fix(download): use original PNG wallpaper"
          git push origin HEAD:main
