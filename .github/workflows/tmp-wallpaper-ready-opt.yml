name: Prepare wallpaper ready optimization

on:
  push:
    branches: ["tmp-wallpaper-opt-work"]
    paths:
      - ".github/workflows/tmp-wallpaper-ready-opt.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-wallpaper-opt-work
      - name: Gate first paint on decoded wallpaper
        shell: python
        run: |
          from pathlib import Path

          ready_js = r'''(() => {
            const root = document.documentElement;
            const src = root.dataset.wallpaperSrc;
            const layer = document.querySelector(".beach-wallpaper");
            let contentRevealed = false;
            let decodeStarted = false;

            const revealContent = () => {
              if (contentRevealed) return;
              contentRevealed = true;
              root.classList.remove("wallpaper-pending");
              root.classList.add("wallpaper-ready");
            };

            const revealWallpaper = () => {
              if (layer) layer.classList.add("is-ready");
              window.requestAnimationFrame(revealContent);
            };

            if (!src || !layer) {
              revealContent();
              return;
            }

            const image = new Image();
            image.decoding = "async";
            image.fetchPriority = "high";

            const decodeAndReveal = async () => {
              if (decodeStarted) return;
              decodeStarted = true;
              try {
                if (typeof image.decode === "function") await image.decode();
              } catch (_) {
                // A completed image can still be safely shown when decode() rejects.
              }
              if (image.naturalWidth > 0) revealWallpaper();
              else revealContent();
            };

            image.addEventListener("load", () => void decodeAndReveal(), { once: true });
            image.addEventListener("error", revealContent, { once: true });
            image.src = src;

            if (image.complete && image.naturalWidth > 0) void decodeAndReveal();

            window.setTimeout(revealContent, 8000);
          })();
          '''

          ready_css = r'''html.wallpaper-pending {
            background: #21313c;
          }

          html.wallpaper-pending body > :not(.cosmos) {
            visibility: hidden !important;
          }

          html.wallpaper-pending .beach-wallpaper {
            opacity: 0 !important;
            transition: none !important;
          }

          html.wallpaper-ready .beach-wallpaper.is-ready {
            transition: none !important;
          }
          '''

          Path("download/wallpaper-ready-v1.js").write_text(ready_js, encoding="utf-8")
          Path("download/wallpaper-ready-v1.css").write_text(ready_css, encoding="utf-8")

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"expected one {label}, found {text.count(old)}")
              return text.replace(old, new, 1)

          index_path = Path("download/index.html")
          index = index_path.read_text(encoding="utf-8")
          index = replace_once(
              index,
              '<html lang="zh-CN" class="session-boot" data-wallpaper-id=',
              '<html lang="zh-CN" class="session-boot wallpaper-pending" data-wallpaper-id=',
              "download html class",
          )
          index = replace_once(
              index,
              '  <link rel="stylesheet" href="./beach-wallpaper-v1.css?v=20260829-first-paint-1" />',
              '  <link rel="stylesheet" href="./beach-wallpaper-v1.css?v=20260829-first-paint-1" />\n  <link rel="stylesheet" href="./wallpaper-ready-v1.css?v=20260829-1521" />\n  <script defer src="./wallpaper-ready-v1.js?v=20260829-1521"></script>',
              "download ready assets",
          )
          index = replace_once(
              index,
              '<div class="beach-wallpaper is-ready" data-wallpaper="beach-blue"',
              '<div class="beach-wallpaper" data-wallpaper="beach-blue"',
              "download ready class",
          )
          index_path.write_text(index, encoding="utf-8")

          usage_path = Path("download/usage.html")
          usage = usage_path.read_text(encoding="utf-8")
          usage = replace_once(
              usage,
              '<html lang="zh-CN">',
              '<html lang="zh-CN" class="wallpaper-pending" data-wallpaper-src="./wallpaper-rain-anime-v1.png?v=20260825-1540">',
              "monitor html state",
          )
          usage = replace_once(
              usage,
              '  <link rel="stylesheet" href="./beach-wallpaper-v1.css?v=20260829-first-paint-1" />',
              '  <link rel="stylesheet" href="./beach-wallpaper-v1.css?v=20260829-first-paint-1" />\n  <link rel="stylesheet" href="./wallpaper-ready-v1.css?v=20260829-1521" />\n  <script defer src="./wallpaper-ready-v1.js?v=20260829-1521"></script>',
              "monitor ready assets",
          )
          usage = replace_once(
              usage,
              '<div class="beach-wallpaper is-ready" data-wallpaper="rain-anime"',
              '<div class="beach-wallpaper" data-wallpaper="rain-anime"',
              "monitor ready class",
          )
          usage_path.write_text(usage, encoding="utf-8")
      - name: Commit prepared tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-wallpaper-ready-opt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/index.html download/usage.html download/wallpaper-ready-v1.js download/wallpaper-ready-v1.css .github/workflows/tmp-wallpaper-ready-opt.yml
          git commit -m "fix(download): reveal wallpaper after decode"
          git push origin HEAD:tmp-wallpaper-opt-work
