<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4d5367" />
  <title>Listing Studio · Download</title>
  <link rel="stylesheet" href="./styles-v2.css" />
</head>
<body>
  <div class="abstract-bg" aria-hidden="true">
    <span class="shape shape-a"></span>
    <span class="shape shape-b"></span>
    <span class="shape shape-c"></span>
  </div>

  <main class="home container">
    <section class="left-panel">
      <div class="brand-block fade">
        <div class="brand-avatar" aria-hidden="true">LS</div>
        <div class="brand-name text-hidden">
          <span>Listing</span><span class="brand-suffix">.studio</span>
        </div>
      </div>

      <article class="description cards fade">
        <div class="quote quote-left">“</div>
        <div class="description-content">
          <div class="login-copy">
            <p class="hello">Hello !</p>
            <p class="welcome">登录后获取最新版本。</p>
          </div>
        </div>

        <div id="loggedOutState">
          <form id="loginForm" class="login-form" autocomplete="on">
            <input id="emailInput" type="email" autocomplete="email" placeholder="邮箱" required />
            <input id="passwordInput" type="password" autocomplete="current-password" placeholder="密码" required />
            <button class="login-button cards" type="submit">登录</button>
          </form>
          <p class="form-note" id="loginMessage">登录后即可下载最新版安装包。</p>
        </div>

        <div id="loggedInState" class="signed-in" hidden>
          <div>
            <p class="hello">Welcome back !</p>
            <p class="account-email" id="accountEmail">—</p>
          </div>
          <button class="plain-button" id="logoutButton" type="button">退出</button>
        </div>

        <div class="quote quote-right">”</div>
      </article>

      <nav class="social fade" aria-label="quick links">
        <a class="social-item" href="/" title="返回主页">⌂</a>
        <span class="social-item" title="Windows 10 / 11">⊞</span>
        <span class="social-item" title="Microsoft Edge">◉</span>
        <span class="social-item" title="x64">64</span>
        <span class="social-item" title="安全下载">◇</span>
        <span class="social-item" title="最新版本">↻</span>
      </nav>
    </section>

    <section class="right-panel">
      <div class="right-top fade">
        <article class="cards top-card release-quote">
          <p class="top-card-label">LATEST RELEASE</p>
          <p class="release-sentence">只保留一个明确的最新版入口。</p>
          <div class="release-sign">— Listing Studio</div>
        </article>

        <article class="cards top-card release-status">
          <p class="top-card-label">CURRENT BUILD</p>
          <div class="version-big" id="versionNumber">v0.1.0</div>
          <div class="version-date" id="publishedAt">2026.08.13 发布</div>
          <div class="account-state"><i></i><span id="accountStateText">未登录</span></div>
        </article>
      </div>

      <div class="links-title fade">
        <span class="list-icon">▦</span>
        <span>下载中心</span>
      </div>

      <div class="action-grid fade">
        <button class="action-card cards" id="downloadButton" type="button" disabled>
          <span class="action-icon">⇩</span>
          <span class="action-name">最新版</span>
          <small id="downloadButtonHint">请先登录</small>
        </button>

        <button class="action-card cards" id="notesAction" type="button">
          <span class="action-icon">☷</span>
          <span class="action-name">更新日志</span>
          <small>Release notes</small>
        </button>

        <button class="action-card cards" id="systemAction" type="button">
          <span class="action-icon">▣</span>
          <span class="action-name">运行环境</span>
          <small id="platformText">Windows 10 / 11 · x64</small>
        </button>

        <button class="action-card cards" id="loginShortcut" type="button">
          <span class="action-icon">●</span>
          <span class="action-name">登录账户</span>
          <small id="loginShortcutHint">Account</small>
        </button>

        <button class="action-card cards" id="supportAction" type="button">
          <span class="action-icon">?</span>
          <span class="action-name">安装帮助</span>
          <small>Support</small>
        </button>

        <a class="action-card cards" href="/">
          <span class="action-icon">⌂</span>
          <span class="action-name">返回主页</span>
          <small>smirel.com</small>
        </a>
      </div>

      <div class="release-meta fade">
        <span id="fileSizeText">安装包大小待发布</span>
        <span>Windows x64</span>
        <span>Secure distribution</span>
      </div>
    </section>
  </main>

  <div class="modal-layer" id="modalLayer" hidden>
    <div class="modal-mask" id="modalMask"></div>
    <article class="modal-card cards" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
      <p class="modal-kicker" id="modalKicker">DETAIL</p>
      <h2 id="modalTitle">详情</h2>
      <div class="modal-body" id="modalBody"></div>
    </article>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./config-v2.js"></script>
  <script type="module" src="./app-v2.js"></script>
</body>
</html>
