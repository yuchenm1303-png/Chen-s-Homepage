<body class="crt-lines-off">
  <div class="desktop" aria-label="Retro desktop personal homepage">
    <div class="cloud-layer cloud-layer-a" aria-hidden="true"></div>
    <div class="cloud-layer cloud-layer-b" aria-hidden="true"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <div class="desktop-icons" aria-label="桌面应用">
      <button class="desktop-shortcut" type="button" data-open="ipinfo">
        <span class="shortcut-icon ipx-shortcut-icon" aria-hidden="true"></span>
        <span data-i18n="shortcutIp">IP 检测器</span>
      </button>
    </div>

    <main class="stage">
      <section class="window" id="profileWindow" aria-labelledby="windowTitle">
        <header class="titlebar">
          <div class="titlebar-title" id="windowTitle">
            <img src="assets/icon.svg" alt="" class="app-icon" />
            <span>Smirel</span>
          </div>
          <div class="window-controls" aria-label="Window controls">
            <button class="lang-switch" id="langSwitch" type="button" aria-label="切换语言">EN</button>
            <button class="window-button" id="minimizeButton" type="button" aria-label="Minimize">_</button>
            <button class="window-button" id="maximizeButton" type="button" aria-label="Maximize">□</button>
            <button class="window-button close-button" id="closeButton" type="button" aria-label="Close">×</button>
          </div>
        </header>

        <div class="window-body" id="windowBody">
          <nav class="menu-bar" aria-label="Main navigation">
            <button class="menu-item active" type="button" data-section="about" data-i18n="navAbout">About</button>
            <button class="menu-item" type="button" data-section="projects" data-i18n="navProjects">Projects</button>
            <button class="menu-item" type="button" data-section="blog" data-i18n="navBlog">Blog</button>
            <button class="menu-item" type="button" data-section="contact" data-i18n="navContact">Contact</button>
          </nav>

          <div class="content-frame">
            <div class="content-scroll screen-refresh" id="content" tabindex="0" aria-live="polite"></div>
          </div>

          <footer class="status-bar">
            <span class="status-cell"><i class="online-dot" aria-hidden="true"></i><span data-i18n="online">ONLINE</span></span>
            <span class="status-cell" data-i18n="updated">Last updated: 2026.08</span>
            <span class="status-cell status-right status-progress" aria-label="System activity">
              <span class="status-progress-track" aria-hidden="true"></span>
            </span>
          </footer>
        </div>
      </section>

      <section class="closed-dialog" id="closedDialog" hidden>
        <div class="dialog-title">SYSTEM MESSAGE</div>
        <p data-i18n="closedMessage">The homepage window is closed.</p>
        <button class="retro-button" id="reopenButton" type="button" data-i18n="reopen">Reopen</button>
      </section>
    </main>

    <div class="taskbar" aria-label="Desktop taskbar">
      <div class="start-button" aria-label="Start">
        <span class="start-mark" aria-hidden="true"></span>
        <span>START</span>
      </div>
      <button class="taskbar-item is-active" id="taskbarWindowButton" type="button" aria-pressed="true">Smirel</button>
      <button class="crt-toggle" id="crtToggle" type="button" aria-pressed="false" title="开启 CRT 条纹">
        <span class="crt-toggle-led" aria-hidden="true"></span>
        <span>CRT</span>
      </button>
      <div class="clock" id="clock">--:--</div>
    </div>

    <div class="crt-overlay" aria-hidden="true"></div>
    <div class="noise-overlay" aria-hidden="true"></div>
